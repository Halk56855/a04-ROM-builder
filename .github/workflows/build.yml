name: Build AxionOS 22.2 for Galaxy A04 (GitHub Actions Only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Extreme Disk Space Vacuum (Clean Everything)
        run: |
          echo "=== Wiping all preinstalled apps, caches, and tools ==="
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/node_modules /usr/local/share/boost /usr/share/swift /var/lib/docker /usr/local/lib/android /opt/hostedtoolcache
          sudo apt-get purge -y azure-cli google-cloud-cli microsoft-edge-stable firefox powershell ruby-* php-* dotnet-* mysql-* postgresql-* || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          # تفريغ الـ cache بالكامل وزيادة الـ tmpfs إن أمكن
          sudo rm -rf /tmp/* /var/tmp/*
          df -h

      - name: Install Minimal Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zip zlib1g-dev

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize AxionOS Workspace (Minimal Groups)
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "Builder"
          git config --global user.email "builder@example.com"
          repo init -u https://github.com/AxionAOSP/android.git -b lineage-22.2 --git-lfs --depth=1 -g default,device,vendor,hardware,-mips,-darwin,-windows,-notdefault,-qcom,-mediatek,-gapps

      - name: Setup Local Manifests for A04
        run: |
          cd workspace
          mkdir -p .repo/local_manifests
          cat << 'EOF' > .repo/local_manifests/a04.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="A04-Trees-and-ROMs/android_device_samsung_a04" path="device/samsung/a04" remote="github" revision="lineage-22.2" />
            <project name="A04-Trees-and-ROMs/android_vendor_samsung_a04" path="vendor/samsung/a04" remote="github" revision="lineage-22.2" />
            <project name="A04-Trees-and-ROMs/android_kernel_samsung_a04" path="kernel/samsung/a04" remote="github" revision="lineage-22.2" />
          </manifest>
          EOF

      - name: Sync Source Tree (Single Thread to Avoid RAM/Disk Spike)
        run: |
          cd workspace
          # استخدام خيوط فردية لتجنب تضخم المؤقتات
          repo sync -c --no-clone-bundle --no-tags --force-sync -j1 --optimized-fetch --prune

      - name: Immediate Pruning to Free Space Before Build
        run: |
          cd workspace
          rm -rf .repo/project-objects
          rm -rf .repo/projects
          find . -type d -name ".git" | xargs rm -rf
          df -h

      - name: Start Compilation
        run: |
          cd workspace
          export USE_CCACHE=0
          source build/envsetup.sh
          lunch axion_a04-userdebug || lunch lineage_a04-userdebug
          mka bacon || ax -br

      - name: Cleanup and Upload
        run: |
          mkdir -p artifacts
          find workspace/out/target/product/ -name "*.zip" -exec cp {} artifacts/ \;
          rm -rf workspace/out
          
      - name: Upload Zip
        uses: actions/upload-artifact@v4
        with:
          name: ROM-A04-AxionOS-22.2
          path: artifacts/*.zip
