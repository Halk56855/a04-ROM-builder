name: Build AxionOS Android 16 for Samsung A04 (Optimized)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Disk Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zip zlib1g-dev python3 python-is-python3

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure Git Identity
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Initialize and Sync AxionOS Android 16 Source (Shallow)
        run: |
          mkdir -p ~/axion
          cd ~/axion
          # استخدام --depth=1 لتخفيض حجم السورس بشكل جذري
          repo init -u https://github.com/AxionAOSP/android -b lineage-23.2 --depth=1 --git-lfs
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc --all)

      - name: Clone Device, Vendor, and Kernel Trees
        run: |
          cd ~/axion
          git clone https://github.com/A04-Trees-and-ROMs/android_device_samsung_a04.git -b lineage-22.2 device/samsung/a04 --depth=1
          git clone https://github.com/A04-Trees-and-ROMs/android_vendor_samsung_a04.git -b lineage-22.2 vendor/samsung/a04 --depth=1
          git clone https://github.com/Halk56855/kernel_samsung_wingtech.git -b android-4.19-stable kernel/samsung/a04 --depth=1

      - name: Configure Ccache Limit
        run: |
          export CCACHE_DIR=~/axion/.ccache
          ccache -M 10G

      - name: Set up Environment and Build ROM
        run: |
          cd ~/axion
          source build/envsetup.sh
          lunch axion_a04-userdebug
          mka bacon -j$(nproc --all)

      - name: Cleanup Unnecessary Files to Save Space
        run: |
          # حذف مجلدات الكاش والملفات المؤقتة الضخمة غير الضرورية بعد البناء
          rm -rf ~/axion/.ccache
          rm -rf ~/axion/out/target/product/a04/obj

      - name: Upload to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AxionOS-Android16-A04-Build
          path: ~/axion/out/target/product/a04/*.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "android16-${{ github.run_id }}"
          name: "AxionOS A04 Android 16 Build ${{ github.run_id }}"
          files: ~/axion/out/target/product/a04/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Telegram and GoFile
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: "6899540935"
        run: |
          ZIP_FILE=$(ls ~/axion/out/target/product/a04/*.zip)
          
          echo "جاري رفع الروم إلى تليجرام..."
          curl -F "chat_id=$CHAT_ID" -F "document=@$ZIP_FILE" https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          
          echo "جاري الرفع إلى GoFile..."
          GOFILE_SERVER=$(curl -s https://api.gofile.io/servers | grep -o '"name":"[^"]*"' | head -n 1 | cut -d'"' -f4)
          curl -F "file=@$ZIP_FILE" https://${GOFILE_SERVER}.gofile.io/contents/uploadfile
