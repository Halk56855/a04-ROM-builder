name: Build AxionOS 22.2 for Galaxy A04

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Absolute Space Eraser (Wipe Everything Unrelated)
        run: |
          echo "=== Wiping all preinstalled environments ==="
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/share/swift
          sudo rm -rf /var/lib/docker
          sudo rm -rf /usr/local/share/vcpkg
          sudo apt-get purge -y azure-cli google-cloud-cli microsoft-edge-stable firefox powershell ruby-* php-* || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h

      - name: Install Minimal Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zip zlib1g-dev

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize AxionOS Workspace (Lineage-22.2 Branch)
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "Builder"
          git config --global user.email "builder@example.com"
          # تهيئة سورس AxionOS بالفرع الموجود في الصورة الصحيح
          repo init -u https://github.com/AxionAOSP/android.git -b lineage-22.2 --git-lfs --depth=1 -g default,-mips,-darwin,-windows,-notdefault

      - name: Setup Local Manifests for A04
        run: |
          cd workspace
          mkdir -p .repo/local_manifests
          cat << 'EOF' > .repo/local_manifests/a04.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="A04-Trees-and-ROMs/android_device_samsung_a04" path="device/samsung/a04" remote="github" revision="lineage-22.2" />
            <project name="A04-Trees-and-ROMs/android_vendor_samsung_a04" path="vendor/samsung/a04" remote="github" revision="lineage-22.2" />
            <project name="A04-Trees-and-ROMs/android_kernel_samsung_a04" path="kernel/samsung/a04" remote="github" revision="lineage-22.2" />
          </manifest>
          EOF

      - name: Sync Source Tree (Minimal Groups & Single Thread)
        run: |
          cd workspace
          repo sync -c --no-clone-bundle --no-tags --force-sync -j1 --optimized-fetch --prune

      - name: Tactical Space Rescue (Delete .repo metadata immediately)
        run: |
          echo "=== DESTROYING .repo to save the build ==="
          rm -rf workspace/.repo
          df -h

      - name: Start Compilation (Zero Ccache, Maximum Strip)
        run: |
          cd workspace
          export USE_CCACHE=0
          source build/envsetup.sh
          lunch axion_a04-userdebug
          mka bacon

      - name: Cleanup and Upload
        run: |
          mkdir -p artifacts
          find workspace/out/target/product/a04/ -name "*.zip" -exec cp {} artifacts/ \;
          rm -rf workspace/out
          
      - name: Upload Zip
        uses: actions/upload-artifact@v4
        with:
          name: ROM-A04-AxionOS-22.2
          path: artifacts/*.zip
