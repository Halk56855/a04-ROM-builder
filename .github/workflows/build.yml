name: Build crDroid for Galaxy A04 (GitHub Actions Only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Up Huge Disk Space (Aggressive Mode)
        run: |
          echo "=== Free Space Before ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /var/lib/docker
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/code
          sudo rm -rf /usr/local/lib/node_modules
          sudo apt-get purge -y azure-cli google-cloud-cli microsoft-edge-stable firefox powershell ruby-* php-* dotnet-* mysql-* postgresql-* || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          echo "=== Free Space After ==="
          df -h

      - name: Install Minimal Build Tools & Ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zip zlib1g-dev ccache

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize crDroid Workspace (Ultra Slim)
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "Builder"
          git config --global user.email "builder@example.com"
          repo init -u https://github.com/crdroidandroid/android.git -b 15.0 --git-lfs --depth=1 -g default,device,vendor,hardware,-mips,-darwin,-windows,-notdefault,-qcom,-mediatek,-gapps,-rust

      - name: Setup Local Manifests for A04
        run: |
          cd workspace
          mkdir -p .repo/local_manifests
          cat << 'EOF' > .repo/local_manifests/a04.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="A04-Trees-and-ROMs/android_device_samsung_a04" path="device/samsung/a04" remote="github" revision="lineage-22.2" />
            <project name="A04-Trees-and-ROMs/android_vendor_samsung_a04" path="vendor/samsung/a04" remote="github" revision="lineage-22.2" />
            <project name="A04-Trees-and-ROMs/android_kernel_samsung_a04" path="kernel/samsung/a04" remote="github" revision="lineage-22.2" />
          </manifest>
          EOF
          
          cat << 'EOF' > .repo/local_manifests/remove.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remove-project name="platform/prebuilts/clang/host/linux-x86" />
          </manifest>
          EOF

      - name: Sync Source Tree (Space Optimized)
        run: |
          cd workspace
          repo sync -c --no-clone-bundle --no-tags --force-sync -j4 --optimized-fetch --prune || repo sync -c --no-clone-bundle --no-tags --force-sync -j1 --optimized-fetch --prune
          
          # تثبيت نسخة Clang خفيفة ومتوافقة لتجنب الانهيار ومساحة القرص
          mkdir -p prebuilts/clang/host/linux-x86
          git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r536225.git prebuilts/clang/host/linux-x86/clang-r536225 || true

          # تنظيف مخلفات الـ git والـ objects لتفريغ المساحة فوراً
          rm -rf .repo/project-objects
          rm -rf .repo/projects
          find . -type d -name ".git" | xargs rm -rf
          df -h

      - name: Start Compilation for crDroid
        run: |
          cd workspace
          export USE_CCACHE=0
          export TARGET_RELEASE=trunk_staging
          export TARGET_PRODUCT=crdroid_a04
          export TARGET_DEVICE=a04
          export TARGET_BUILD_VARIANT=userdebug
          export PRODUCT_OUT="$PWD/out/target/product/a04"
          mkdir -p "$PRODUCT_OUT"
          
          source build/envsetup.sh
          lunch crdroid_a04-trunk_staging-userdebug || lunch lineage_a04-trunk_staging-userdebug || lunch crdroid_a04-userdebug || true
          mka bacon || make bacon

      - name: Cleanup and Upload
        run: |
          mkdir -p artifacts
          find workspace/out/target/product/ -name "*.zip" -exec cp {} artifacts/ \;
          rm -rf workspace/out
          
      - name: Upload Zip
        uses: actions/upload-artifact@v4
        with:
          name: ROM-A04-crDroid
          path: artifacts/*.zip
