name: Build and Modify Samsung ROM

on:
  workflow_dispatch: # يسمح بتشغيل البناء يدوياً من هاتفك

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب مستودعك الخاص
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. تثبيت الأدوات الأساسية وحزم التعامل مع صور النظام
      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget curl python3 python3-pip \
            openjdk-17-jdk zip unzip tar cpio android-sdk-libsparse-utils

      # 3. تحميل الروم الرسمي مباشرة من Google Drive
      - name: Download Official Firmware
        run: |
          echo "Starting firmware download from Google Drive..."
          mkdir -p extracted_firmware
          # استخدام الرابط المباشر الذي قدمته مع تمرير الكوكيز الخاصة بملفات جوجل الكبيرة
          wget --load-cookies /tmp/cookies.txt "https://docs.google.com/uc?export=download&confirm=$(wget --save-cookies /tmp/cookies.txt --keep-session-cookies --no-check-certificate 'https://docs.google.com/uc?export=download&id=1xszeIGsH1eBctll0mJI7VzVeuDEMgf-f' -O- | sed -rn 's/.*confirm=([0-9A-Za-z_]+).*/\1\n/p')&id=1xszeIGsH1eBctll0mJI7VzVeuDEMgf-f" -O firmware.zip || wget -O firmware.zip "https://drive.usercontent.google.com/download?id=1xszeIGsH1eBctll0mJI7VzVeuDEMgf-f&export=download&authuser=0"
          
          echo "Checking downloaded file..."
          ls -lah firmware.zip
          
          echo "Extracting firmware container..."
          unzip -q firmware.zip -d extracted_firmware/
          ls -lah extracted_firmware/

      # 4. تشغيل سكريبت التعديل والتخفيف
      - name: Run Modification Script
        run: |
          mkdir -p tools
          if [ -f "./tools/mod_script.sh" ]; then
            chmod +x ./tools/mod_script.sh
            ./tools/mod_script.sh
          else
            echo "mod_script.sh not found, skipping custom script step."
            mkdir -p build_output
            cp -r extracted_firmware/* build_output/
          fi

      # 5. تجميع الملفات النهائية في ملف TAR متوافق مع Odin
      - name: Create Odin Package Output
        run: |
          echo "Packaging modified files..."
          mkdir -p output
          if [ -d "build_output" ]; then
            tar -cvf output/MODIFIED_AP_GalaxyA04.tar -C build_output/ .
          else
            tar -cvf output/MODIFIED_AP_GalaxyA04.tar -C extracted_firmware/ .
          fi

      # 6. رفع الروم المعدل كـ Artifact لتتمكن من تحميله
      - name: Upload Modified ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Modified-Samsung-ROM-A04
          path: output/*.tar
          retention-days: 3
