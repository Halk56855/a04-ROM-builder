name: Build and Modify Samsung ROM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget curl python3 python3-pip \
            openjdk-17-jdk zip unzip tar cpio android-sdk-libsparse-utils
          pip3 install --upgrade gdown

      # 3. التحميل المباشر عبر تمرير الرابط الكامل لـ gdown
      - name: Download Official Firmware
        run: |
          echo "Starting firmware download from Google Drive using gdown..."
          mkdir -p extracted_firmware
          
          # تمرير رابط جوجل درايف الكامل لتتولى gdown عملية تخطي تحذير الحجم تلقائياً
          gdown "https://drive.google.com/uc?id=1xszeIGsH1eBctll0mJI7VzVeuDEMgf-f&export=download" -O firmware.zip
          
          echo "Checking downloaded file size..."
          ls -lah firmware.zip
          
          echo "Extracting firmware container..."
          unzip -q firmware.zip -d extracted_firmware/
          ls -lah firmware.zip

      - name: Run Modification Script
        run: |
          mkdir -p tools
          if [ -f "./tools/mod_script.sh" ]; then
            chmod +x ./tools/mod_script.sh
            ./tools/mod_script.sh
          else
            echo "mod_script.sh not found, skipping custom script step."
            mkdir -p build_output
            cp -r extracted_firmware/* build_output/
          fi

      - name: Create Odin Package Output
        run: |
          echo "Packaging modified files..."
          mkdir -p output
          if [ -d "build_output" ]; then
            tar -cvf output/MODIFIED_AP_GalaxyA04.tar -C build_output/ .
          else
            tar -cvf output/MODIFIED_AP_GalaxyA04.tar -C extracted_firmware/ .
          fi

      - name: Upload Modified ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Modified-Samsung-ROM-A04
          path: output/*.tar
          retention-days: 3
