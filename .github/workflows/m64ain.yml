name: Build and Modify Custom A04 ROM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget curl python3 python3-pip \
            openjdk-17-jdk zip unzip tar cpio android-sdk-libsparse-utils

      # 3. تحميل الروم الأساسي الخفيف من SourceForge
      - name: Download Base Clean ROM
        run: |
          echo "Starting base ROM download from SourceForge..."
          mkdir -p extracted_firmware
          wget -O firmware.zip "https://downloads.sourceforge.net/project/oneui-unleashed/A04/No-GApps%20with%20Samsung%20Bloatware%20Debloated/Odin%20Flashable/V1.1/A04%20Clean%20Debloat.zip"
          
          echo "Extracting base firmware container..."
          unzip -q firmware.zip -d extracted_firmware/
          ls -lah extracted_firmware/

      # 4. تشغيل سكريبت الحقن والتخصيص (GApps Super Lite & Lawnchair)
      - name: Run Customization Script
        run: |
          mkdir -p tools
          if [ -f "./tools/mod_script.sh" ]; then
            chmod +x ./tools/mod_script.sh
            ./tools/mod_script.sh
          else
            echo "mod_script.sh not found, copying directly..."
            mkdir -p build_output
            cp -r extracted_firmware/* build_output/
          fi

      # 5. تجميع الملفات النهائية في ملف TAR متوافق مع Odin
      - name: Create Odin Package Output
        run: |
          echo "Packaging final custom ROM..."
          mkdir -p output
          if [ -d "build_output" ]; then
            tar -cvf output/CUSTOM_A04_UNLEASHED_LITE.tar -C build_output/ .
          else
            tar -cvf output/CUSTOM_A04_UNLEASHED_LITE.tar -C extracted_firmware/ .
          fi

      # 6. رفع الروم النهائي كـ Artifact
      - name: Upload Custom ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Custom-A04-Lite-ROM
          path: output/*.tar
          retention-days: 3
