name: Build and Modify Custom A04 ROM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget curl python3 python3-pip lz4 \
            openjdk-17-jdk zip unzip tar cpio android-sdk-libsparse-utils

      - name: Download Base Clean ROM
        run: |
          echo "Starting base ROM download from SourceForge..."
          mkdir -p extracted_firmware
          wget -O firmware.zip "https://downloads.sourceforge.net/project/oneui-unleashed/A04/No-GApps%2520with%2520Samsung%2520Bloatware%2520Debloated/Odin%2520Flashable/V1.1/A04%2520Clean%2520Debloat.zip"
          
          echo "Extracting base firmware container..."
          unzip -q firmware.zip -d extracted_firmware/
          ls -lah extracted_firmware/

      - name: Run Customization Script
        run: |
          mkdir -p tools
          if [ -f "./tools/mod_script.sh" ]; then
            chmod +x ./tools/mod_script.sh
            ./tools/mod_script.sh
          else
            echo "mod_script.sh missing, skipping script..."
          fi

      - name: Create Odin Package Output
        run: |
          echo "Packaging extracted firmware into Odin tar..."
          mkdir -p output
          # ضغط محتويات extracted_firmware مباشرة لضمان خروج ملف الـ AP بالحجم الحقيقي الكامل
          tar -cvf output/AP_CUSTOM_A04_ODIN.tar -C extracted_firmware/ .
          ls -lah output/

      - name: Upload Custom ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Custom-A04-Lite-ROM
          path: output/*.tar
          retention-days: 3
