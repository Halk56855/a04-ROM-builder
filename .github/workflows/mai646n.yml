name: Build Axion GSI Super with OneUI Base for Galaxy A04

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget curl python3 python3-pip \
            xz-utils p7zip-full zip unzip tar aria2 \
            bc ccache dosfstools e2fsprogs f2fs-tools \
            mtd-utils rsync squashfs-tools android-sdk-libsparse-utils

          pip3 install --upgrade pip
          pip3 install protobuf

      - name: Download Axion GSI & OneUI Base ROM
        run: |
          mkdir -p workspace/oneui workspace/gsi workspace/output
          
          GSI_URL="https://github.com/Doze-off/axion_aosp/releases/download/2026-08-24/Axion-2.8-GSI_treble_arm64-ab-MICROG-20260824.img.xz"
          ONEUI_URL="https://downloads.sourceforge.net/project/oneui-unleashed/A04/No-GApps%20with%20Samsung%20Bloatware%20Debloated/Odin%20Flashable/V1.1/A04%20Clean%20Debloat.zip"
          
          echo "Downloading Axion GSI..."
          aria2c -c -x 16 -s 16 "$GSI_URL" -o workspace/gsi/gsi.img.xz
          
          echo "Downloading OneUI Base ROM..."
          aria2c -c -x 16 -s 16 "$ONEUI_URL" -o workspace/oneui/oneui.zip

      - name: Extract Files & Prepare System
        run: |
          cd workspace
          
          echo "Extracting Axion GSI..."
          xz -d gsi/gsi.img.xz
          mv gsi/gsi.img gsi/system.img
          
          echo "Extracting OneUI Base ROM..."
          unzip -q oneui/oneui.zip -d oneui/extracted/
          
          # استخراج الأقسام الأخرى الضرورية (مثل vendor, product, odm) من روم OneUI إذا كانت موجودة كملفات img أو داخل tar/lz4
          find oneui/extracted/ -name "*.img" -exec cp {} gsi/ \; || true
          ls -la gsi/

      - name: Build Super Partition (lpmake)
        run: |
          cd workspace
          mkdir -p output
          
          echo "--- جاري بناء ملف super.img عبر lpmake ---"
          
          # تحديد حجم الـ super partition الخاص بهاتف Galaxy A04 (غالباً حوالي 4GB إلى 5GB - يتم ضبطها حسب المساحة القياسية)
          SUPER_SIZE=4831838208 
          
          # التحقق من وجود الأقسام المطلوبة لإنتاج super.img
          if [ -f gsi/system.img ]; then
            # استخدام أمر lpmake لدمج نظام GSI مع بقية أقسام سامسونج إن وجدت
            lpmake \
              --device-size $SUPER_SIZE \
              --metadata-size 65536 \
              --metadata-slots 3 \
              --group main_a $SUPER_SIZE \
              --partition system:readonly:$(stat -c%s gsi/system.img):main_a \
              --image system=gsi/system.img \
              --output output/super.img
          else
            echo "خطأ: لم يتم العثور على ملف system.img!"
            exit 1
          fi

      - name: Package Super.img for Odin
        run: |
          cd workspace/output
          if [ -f super.img ]; then
            echo "تم بناء super.img بنجاح، جاري الضغط بصيغة Odin tar..."
            tar -cvf super.tar super.img
            gzip super.tar
          else
            echo "فشل بناء ملف super.img"
            exit 1
          fi

      - name: Upload Final Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: super-galaxy-a04-axion
          path: workspace/output/super.tar.gz
          retention-days: 3
