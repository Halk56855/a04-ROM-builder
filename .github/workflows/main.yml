name: Build AxionOS for Samsung A04

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build Variant (va, gms pico, etc.)'
        required: true
        default: 'va'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Purge Everything Unnecessary
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android /opt/hostedtoolcache /usr/share/swift /usr/share/miniconda
          sudo apt-get purge -y azure-cli google-cloud-sdk firefox google-chrome-stable microsoft-edge-stable powershell snapd valgrind libreoffice* mysql* php* postgresql* || true
          sudo apt-get autoremove -y --purge
          sudo apt-get clean
          df -h

      - name: Install Essential Build Tools Only
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32z1-dev libelf-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop rsync schedtool squashfs-tools xsltproc yasm zlib1g-dev python3 python-is-python3 unzip zip git-lfs

      - name: Install Repo
        run: |
          sudo mkdir -p /usr/local/bin
          sudo curl -s https://storage.googleapis.com/git-repo-downloads/repo > /usr/local/bin/repo
          sudo chmod +x /usr/local/bin/repo

      - name: Git Config
        run: |
          git config --global user.name "A04Builder"
          git config --global user.email "a04@builder.com"

      - name: Micro Sync (LineageOS Base)
        run: |
          mkdir -p ~/axion && cd ~/axion
          repo init -u https://github.com/LineageOS/android.git -b lineage-22.2 --git-lfs --depth=1 --no-repo-verify
          
          mkdir -p .repo/local_manifests
          cat << 'EOF' > .repo/local_manifests/a04.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="A04-Trees-and-ROMs/android_device_samsung_a04" path="device/samsung/a04" remote="github" revision="lineage-22.2" />
            <project name="A04-Trees-and-ROMs/android_vendor_samsung_a04" path="vendor/samsung/a04" remote="github" revision="lineage-22.2" />
            <project name="A04-Trees-and-ROMs/android_kernel_samsung_a04" path="kernel/samsung/a04" remote="github" revision="lineage-22.2" />
          </manifest>
          EOF

          repo sync -c -j1 --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune

      - name: Compile
        run: |
          cd ~/axion
          export USE_NINJA=true
          export MALLOC_CHECK_=0
          export SOONG_ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          gk -s
          ax a04 ${{ github.event.inputs.build_variant }} -j1
