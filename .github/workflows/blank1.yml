name: Build LineageOS for Galaxy A04

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Up Disk Space
        run: |
          echo "Freeing up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          df -h

      - name: Set up Native Swap Space (16GB)
        run: |
          echo "Setting up 16GB swap space safely..."
          # إيقاف وحذف أي ملف تبادل قديم لمنع أي تعارض أو أخطاء
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          
          # استخدام طريقة dd الآمنة والمضمونة لتخصيص المساحة
          sudo dd if=/dev/zero of=/swapfile bs=1M count=16384 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Swap space created successfully:"
          free -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5 \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm \
            zip zlib1g-dev openjdk-17-jdk python3

      - name: Set up Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure Git Identity
        run: |
          git config --global user.name "ROM Builder"
          git config --global user.email "builder@rom.local"

      - name: Initialize and Sync Source
        run: |
          mkdir -p workspace
          cd workspace
          repo init -u https://github.com/LineageOS/android.git -b lineage-23.2 --git-lfs
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j8

      - name: Start Building LineageOS
        run: |
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch lineage_a04-userdebug
          mka bacon -j8
