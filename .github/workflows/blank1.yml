name: Build LineageOS for Galaxy A04

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Up Disk Space (Aggressive)
        run: |
          echo "Cleaning up heavy pre-installed packages and tools..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/android
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/julia
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/share/sbt
          sudo rm -rf /usr/share/ant
          # حذف صور وتجهيزات Docker لتوفير مساحة هائلة
          docker system prune -a --volumes -f || true
          echo "Available disk space after cleanup:"
          df -h

      - name: Set up Native Swap Space (16GB)
        run: |
          echo "Setting up 16GB swap space safely..."
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=16384 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Swap space created successfully:"
          free -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses-dev libncurses6 \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm \
            zip zlib1g-dev openjdk-17-jdk python3

      - name: Set up Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure Git Identity
        run: |
          git config --global user.name "ROM Builder"
          git config --global user.email "builder@rom.local"

      - name: Initialize and Sync Source (Optimized for Space)
        run: |
          mkdir -p workspace
          cd workspace
          # استخدام --depth=1 لتجنب تحميل التاريخ الضخم للسورس وتوفير مساحة هائلة
          repo init -u https://github.com/LineageOS/android.git -b lineage-23.2 --depth=1 --git-lfs
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --depth=1 -j8

      - name: Start Building LineageOS
        run: |
          cd workspace
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 5G
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch lineage_a04-userdebug
          mka bacon -j8
