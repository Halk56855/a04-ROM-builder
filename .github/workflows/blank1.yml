name: Build WitAqua ROM 15.2 Super Lite for Samsung A04

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Disk Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 512
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zip zlib1g-dev python3 python-is-python3

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure Git Identity
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Initialize and Sync Super Lite Source
        run: |
          mkdir -p ~/witaqua
          cd ~/witaqua
          # استخدام --depth=1 لتقليل حجم سحب السورس بشكل جذري
          repo init -u https://github.com/WitAqua/manifest.git -b 15.2 --depth=1 --git-lfs
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc --all)

      - name: Clone Device, Vendor, and Kernel Trees (Shallow)
        run: |
          cd ~/witaqua
          # سحب ملفات الجهاز والنواة والمورد بشكل سطحي لتوفير المساحة
          git clone --depth=1 https://github.com/A04-Trees-and-ROMs/android_device_samsung_a04.git device/samsung/a04
          git clone --depth=1 https://github.com/A04-Trees-and-ROMs/android_vendor_samsung_a04.git vendor/samsung/a04
          git clone --depth=1 https://github.com/A04-Trees-and-ROMs/android_kernel_samsung_a04.git kernel/samsung/a04

      - name: Set up Environment and Build ROM
        run: |
          cd ~/witaqua
          source build/envsetup.sh
          lunch witaqua_a04-userdebug
          mka bacon -j$(nproc --all)

      - name: Upload to Telegram and GoFile
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: "6899540935"
        run: |
          ZIP_FILE=$(ls ~/witaqua/out/target/product/a04/*.zip 2>/dev/null || true)
          if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
              echo "جاري رفع الروم إلى تليجرام..."
              curl -F "chat_id=$CHAT_ID" -F "document=@$ZIP_FILE" https://api.telegram.org/bot$BOT_TOKEN/sendDocument
              
              echo "جاري الرفع إلى GoFile..."
              GOFILE_SERVER=$(curl -s https://api.gofile.io/servers | grep -o '"name":"[^"]*"' | head -n 1 | cut -d'"' -f4)
              if [ -n "$GOFILE_SERVER" ]; then
                  curl -F "file=@$ZIP_FILE" https://${GOFILE_SERVER}.gofile.io/contents/uploadfile
              fi
          else
              echo "خطأ: لم يتم العثور على ملف الـ ZIP الناتج!"
              exit 1
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "witaqua-15.2-superlite-${{ github.run_id }}"
          name: "WitAqua ROM 15.2 Super Lite A04 Build ${{ github.run_id }}"
          files: ~/witaqua/out/target/product/a04/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
