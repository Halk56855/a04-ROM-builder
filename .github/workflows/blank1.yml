name: Build LineageOS Atomic-Slim

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Atomic Space Liberation (Delete Swap & All Caches)
        run: |
          echo "=== Deleting Swap to free 4GB+ of root disk ==="
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          
          echo "=== Purging all heavy software & tools ==="
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/share/swift
          sudo rm -rf /var/lib/docker
          sudo apt-get purge -y azure-cli google-cloud-cli microsoft-edge-stable firefox powershell || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          
          echo "=== Checking Free Space ==="
          df -h

      - name: Install Minimal Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zip zlib1g-dev

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize Workspace (Atomic Depth)
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "Builder"
          git config --global user.email "builder@example.com"
          repo init -u https://github.com/LineageOS/android.git -b lineage-23.2 --git-lfs --depth=1

      - name: Setup Local Manifests
        run: |
          cd workspace
          mkdir -p .repo/local_manifests
          cat << 'EOF' > .repo/local_manifests/a04.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="A04-Trees-and-ROMs/android_device_samsung_a04" path="device/samsung/a04" remote="github" revision="lineage-22.2" />
            <project name="A04-Trees-and-ROMs/android_vendor_samsung_a04" path="vendor/samsung/a04" remote="github" revision="lineage-22.2" />
            <project name="A04-Trees-and-ROMs/android_kernel_samsung_a04" path="kernel/samsung/a04" remote="github" revision="lineage-22.2" />
          </manifest>
          EOF

      - name: Sync Source Tree (Single Thread - Extreme Lean)
        run: |
          cd workspace
          # استخدام -j1 لمنع أي تضارب أو ضغط مؤقت على القرص أثناء فك الملفات
          repo sync -c --no-clone-bundle --no-tags --force-sync -j1 --optimized-fetch --prune

      - name: Start Compilation (Zero Ccache)
        run: |
          cd workspace
          export USE_CCACHE=0
          source build/envsetup.sh
          breakfast lineage_a04-userdebug
          mka bacon

      - name: Cleanup and Upload
        run: |
          mkdir -p artifacts
          find workspace/out/target/product/a04/ -name "lineage-*.zip" -exec cp {} artifacts/ \;
          rm -rf workspace/out
          
      - name: Upload Zip
        uses: actions/upload-artifact@v4
        with:
          name: ROM-A04-Atomic
          path: artifacts/*.zip
