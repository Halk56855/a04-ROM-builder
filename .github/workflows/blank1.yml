name: Build LineageOS for Galaxy A04

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Up Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zip zlib1g-dev

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize LineageOS Workspace
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "Your Name"
          git config --global user.email "your-email@example.com"
          repo init -u https://github.com/LineageOS/android.git -b lineage-23.2 --git-lfs --depth=1

      - name: Setup Local Manifests
        run: |
          cd workspace
          mkdir -p .repo/local_manifests
          cat << 'EOF' > .repo/local_manifests/a04.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="A04-Trees-and-ROMs/android_device_samsung_a04" path="device/samsung/a04" remote="github" revision="lineage-22.2" />
            <project name="A04-Trees-and-ROMs/android_vendor_samsung_a04" path="vendor/samsung/a04" remote="github" revision="lineage-22.2" />
            <project name="A04-Trees-and-ROMs/android_kernel_samsung_a04" path="kernel/samsung/a04" remote="github" revision="lineage-22.2" />
          </manifest>
          EOF

      - name: Sync Source Tree
        run: |
          cd workspace
          repo sync -c --no-clone-bundle --no-tags --force-sync -j$(nproc)

      - name: Start Compilation
        run: |
          cd workspace
          export USE_CCACHE=1
          source build/envsetup.sh
          breakfast lineage_a04-userdebug
          mka bacon

      - name: Cleanup and Upload
        run: |
          mkdir -p artifacts
          find workspace/out/target/product/a04/ -name "lineage-*.zip" -exec cp {} artifacts/ \;
          rm -rf workspace/out
          
      - name: Upload Zip
        uses: actions/upload-artifact@v4
        with:
          name: ROM-A04
          path: artifacts/*.zip
