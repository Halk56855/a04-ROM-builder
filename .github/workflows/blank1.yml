name: Build LineageOS for Galaxy A04

on:
  workflow_dispatch:
    # يتيح لك تشغيل البناء يدوياً من تبويب Actions

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Disk Space
        uses: easimon/maximize-disk-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          build-mount-path: '/workspace'
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-code-spaces: 'true'

      - name: Set up Swap Space (16GB)
        uses: pierreguillot/setup-swap-space@v1.0.2
        with:
          swap-size-gb: 16

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5 \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm \
            zip zlib1g-dev openjdk-17-jdk python3

      - name: Set up Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure Git Identity
        run: |
          git config --global user.name "ROM Builder"
          git config --global user.email "builder@rom.local"

      - name: Initialize and Sync Source
        run: |
          mkdir -p workspace
          cd workspace
          repo init -u https://github.com/LineageOS/android.git -b lineage-23.2 --git-lfs
          # ضع أوامر مزامنة الـ manifests أو جلب الـ Device Trees هنا إذا لم تكن مضمنة مسبقاً
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j8

      - name: Start Building LineageOS
        run: |
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch lineage_a04-userdebug
          
          # استخدام -j8 لمنع انهيار الـ RAM (الخادم يمتلك 15.6GB فقط)
          mka bacon -j8
