name: Build LineageOS 23.2 for Galaxy A04 (Custom Trees)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Safe Swap Space (12GB)
        run: |
          echo "=== Creating 12GB Swap to prevent OOM crashes ==="
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Absolute Space Eraser (Wipe Everything Unrelated)
        run: |
          echo "=== Wiping all preinstalled environments ==="
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/share/swift
          sudo rm -rf /var/lib/docker
          sudo rm -rf /usr/local/share/vcpkg
          sudo apt-get purge -y azure-cli google-cloud-cli microsoft-edge-stable firefox powershell ruby-* php-* || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h

      - name: Install Minimal Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zip zlib1g-dev

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize Workspace (Lineage-23.2)
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "Builder"
          git config --global user.email "builder@example.com"
          repo init -u https://github.com/LineageOS/android.git -b lineage-23.2 --git-lfs --depth=1 -g default,-mips,-darwin,-windows,-notdefault

      - name: Setup Local Manifests (Halk56855 Trees)
        run: |
          cd workspace
          mkdir -p .repo/local_manifests
          cat << 'EOF' > .repo/local_manifests/a04.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="Halk56855/android_device_samsung_a04" path="device/samsung/a04" remote="github" revision="lineage-23.2" />
            <project name="Halk56855/android_vendor_samsung_a04f" path="vendor/samsung/a04" remote="github" revision="main" />
            <project name="Halk56855/android_kernel_samsung_a04" path="kernel/samsung/a04" remote="github" revision="lineage-23.2" />
          </manifest>
          EOF

      - name: Sync Source Tree (Minimal Groups & Single Thread)
        run: |
          cd workspace
          repo sync -c --no-clone-bundle --no-tags --force-sync -j1 --optimized-fetch --prune

      - name: Tactical Space Rescue (Delete .repo metadata immediately)
        run: |
          echo "=== DESTROYING .repo to save space ==="
          rm -rf workspace/.repo
          df -h
          free -h

      - name: Fix Readonly BoardConfig Error
        run: |
          cd workspace
          sed -i '/PRODUCT_MINIMIZE_JAVA_DEBUG_INFO/d' device/samsung/a04/BoardConfig.mk

      - name: Patch Missing Vendor Variants for Libjxl Dependencies Safely
        run: |
          cd workspace
          echo "Safely patching libskia_skcms and libhwy if present..."
          
          set +e
          SKCMS_BP=$(find . -name "Android.bp" -type f -exec grep -l 'libskia_skcms' {} + 2>/dev/null || true)
          if [ -n "$SKCMS_BP" ]; then
            for bp in $SKCMS_BP; do
              sed -i '/name: "libskia_skcms"/a \    vendor_available: true,' "$bp" || true
            done
          fi

          HWY_BP=$(find . -name "Android.bp" -type f -exec grep -l 'libhwy' {} + 2>/dev/null || true)
          if [ -n "$HWY_BP" ]; then
            for bp in $HWY_BP; do
              sed -i '/name: "libhwy"/a \    vendor_available: true,' "$bp" || true
            done
          fi
          set -e

      - name: Safely Remove Conflicting Vendor Modules via Python
        run: |
          cd workspace
          python3 - << 'EOF'
          import os

          path = "vendor/samsung/a04/Android.bp"
          if os.path.exists(path):
              with open(path, "r") as f:
                  text = f.read()

              keywords = [
                  "vendor.samsung.hardware.vibrator",
                  "vendor.samsung.hardware.keymint",
                  "android.hardware.light"
              ]

              for kw in keywords:
                  while True:
                      idx = text.find(kw)
                      if idx == -1:
                          break
                      start = text.rfind("\n\n", 0, idx)
                      start = 0 if start == -1 else start + 2

                      brace_count = 0
                      end = idx
                      found_open = False
                      for j in range(start, len(text)):
                          if text[j] == '{':
                              brace_count += 1
                              found_open = True
                          elif text[j] == '}':
                              brace_count -= 1
                              if found_open and brace_count == 0:
                                  end = j + 1
                                  break
                      if end <= idx:
                          end = text.find("\n}", idx)
                          end = end + 2 if end != -1 else idx + len(kw)

                      text = text[:start] + text[end:]

              with open(path, "w") as f:
                  f.write(text)
              print("Android.bp successfully cleaned.")
          EOF

      - name: Start Compilation (Safe RAM Mode -j2)
        run: |
          cd workspace
          export USE_CCACHE=0
          source build/envsetup.sh
          lunch lineage_a04-trunk_staging-userdebug
          mka bacon -j2

      - name: Cleanup and Upload
        run: |
          mkdir -p artifacts
          find workspace/out/target/product/a04/ -name "lineage-*.zip" -exec cp {} artifacts/ \;
          rm -rf workspace/out
          
      - name: Upload Zip
        uses: actions/upload-artifact@v4
        with:
          name: ROM-A04-Lineage23.2-Halk56855
          path: artifacts/*.zip
