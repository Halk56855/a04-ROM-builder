name: Build Ubuntu Touch & UBports Tooling for SM-A045F

on:
  workflow_dispatch:
    inputs:
      defconfig_name:
        description: "Primary defconfig (a04_defconfig or a04_00_defconfig)"
        required: true
        default: "a04_defconfig"
      fallback_defconfig:
        description: "Fallback defconfig if primary fails"
        required: true
        default: "a04_00_defconfig"
      ubports_channel:
        description: "Ubuntu Touch release/channel branch or tag"
        required: true
        default: "main"
      rootfs_url:
        description: "Direct or GitHub URL to arm64 rootfs archive (.tar.gz / .tar.xz / .tar)"
        required: false
        default: ""
      build_installer:
        description: "Build ubports-installer from source (true/false)"
        required: true
        default: "true"

jobs:
  build-ubports-a045f:
    runs-on: ubuntu-24.04
    steps:
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3 python3-pip python3-venv openssl kpartx udev bc bison flex \
            libssl-dev libncurses-dev build-essential device-tree-compiler \
            android-sdk-libsparse-utils e2fsprogs wget tar xz-utils cpio zip unzip file \
            jq curl ca-certificates
          pip3 install --break-system-packages --no-cache-dir mkbootimg || true

      - name: Download GCC & Clang Toolchain
        run: |
          rm -rf "$GITHUB_WORKSPACE/toolchain"
          mkdir -p "$GITHUB_WORKSPACE/toolchain/gcc" "$GITHUB_WORKSPACE/toolchain/clang"

          cd "$GITHUB_WORKSPACE/toolchain/gcc"
          wget -q --show-progress --retry-connrefused --waitretry=2 --read-timeout=30 -t 5 \
            "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz" \
            -O gcc.tar.xz || \
          wget -q --show-progress --retry-connrefused --waitretry=2 --read-timeout=30 -t 5 \
            "https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz" \
            -O gcc.tar.xz
          tar -xf gcc.tar.xz -C ./
          rm -f gcc.tar.xz

          cd "$GITHUB_WORKSPACE/toolchain/clang"
          wget -q --show-progress --retry-connrefused --waitretry=2 --read-timeout=30 -t 5 \
            "https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz" \
            -O clang.tar.gz
          tar -xzf clang.tar.gz -C ./
          rm -f clang.tar.gz

          echo "=== Verifying toolchains ==="
          find "$GITHUB_WORKSPACE/toolchain/gcc" -name "aarch64-none-linux-gnu-gcc" -type f -executable
          find "$GITHUB_WORKSPACE/toolchain/clang" -name "clang" -type f -executable

          cd "$GITHUB_WORKSPACE"

      - name: Clone UBports repos and A04 trees
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ubports_work/extras" "$GITHUB_WORKSPACE/a04_trees"

          git clone --depth=1 https://github.com/ubports/ubports-installer.git \
            "$GITHUB_WORKSPACE/ubports_work/ubports-installer"

          EXTRA_REPOS=(
            "installer-configs|https://github.com/ubports/installer-configs.git"
            "ubports-pdk|https://github.com/ubports/ubports-pdk.git"
            "docs.ubports.com|https://gitlab.com/ubports/docs/docs.ubports.com.git"
            "promise-android-tools|https://github.com/ubports/promise-android-tools.git"
            "utqemu|https://github.com/ubports/utqemu.git"
            "build-tools|https://gitlab.com/ubports/infrastructure/build-tools.git"
            "ubuntu-touch|https://gitlab.com/ubports/development/ubuntu-touch.git"
          )

          for entry in "${EXTRA_REPOS[@]}"; do
            name="${entry%%|*}"
            url="${entry#*|}"
            target="$GITHUB_WORKSPACE/ubports_work/extras/$name"
            if [ "$name" = "ubuntu-touch" ]; then
              git clone --depth=1 --branch "${{ inputs.ubports_channel }}" "$url" "$target" || \
              git clone --depth=1 "$url" "$target" || true
            else
              git clone --depth=1 "$url" "$target" || true
            fi
          done

          ln -sfn "$GITHUB_WORKSPACE/ubports_work/extras/installer-configs" "$GITHUB_WORKSPACE/ubports_work/installer-configs"
          ln -sfn "$GITHUB_WORKSPACE/ubports_work/extras/ubuntu-touch" "$GITHUB_WORKSPACE/ubports_work/ubuntu-touch"

          git clone --depth=1 https://github.com/A04-Trees-and-ROMs/android_device_samsung_a04.git \
            "$GITHUB_WORKSPACE/a04_trees/device"
          git clone --depth=1 https://github.com/A04-Trees-and-ROMs/android_vendor_samsung_a04.git \
            "$GITHUB_WORKSPACE/a04_trees/vendor"
          git clone --depth=1 https://github.com/A04-Trees-and-ROMs/android_kernel_samsung_a04.git \
            "$GITHUB_WORKSPACE/a04_trees/kernel"

          echo "=== Cloned UBports work & extras ==="
          ls -la "$GITHUB_WORKSPACE/ubports_work"
          ls -la "$GITHUB_WORKSPACE/ubports_work/extras"

      - name: Download and extract real Ubuntu Touch arm64 rootfs
        run: |
          ROOTFS_WORK="$GITHUB_WORKSPACE/rootfs_work"
          OUT_DIR="$GITHUB_WORKSPACE/export_out"
          DEV_OUT="$OUT_DIR/a045f_ubports"
          mkdir -p "$ROOTFS_WORK/extracted" "$OUT_DIR" "$DEV_OUT"

          TMP_ARCHIVE="$ROOTFS_WORK/downloaded_rootfs.bin"
          ROOTFS_ARCHIVE="$ROOTFS_WORK/ubuntu-touch-arm64-rootfs.tar.gz"
          MIN_BYTES=1048576
          DOWNLOADED=0
          RAW_INPUT_URL="${{ inputs.rootfs_url }}"
          NORMALIZED_URL=""

          if [ -n "$RAW_INPUT_URL" ]; then
            NORMALIZED_URL=$(printf '%s' "$RAW_INPUT_URL" | sed -E 's#^(https://github\.com/[^/]+/[^/]+)/blob/#\1/raw/#')
            echo "Normalized rootfs URL: $NORMALIZED_URL"
          fi

          CANDIDATE_URLS=()
          if [ -n "$NORMALIZED_URL" ]; then
            CANDIDATE_URLS+=("$NORMALIZED_URL")
          fi
          CANDIDATE_URLS+=(
            "https://cdimage.ubports.com/ubuntu-touch/20.04/arm64/rootfs.tar.gz"
            "https://cdimage.ubports.com/ubuntu-touch/focal/arm64/rootfs.tar.gz"
            "https://ci-images.ubports.com/ubuntu-touch/focal/arm64/rootfs.tar.gz"
          )

          verify_rootfs_archive() {
            local file_path="$1"
            if [ ! -s "$file_path" ]; then
              echo "Archive is missing or empty"
              return 1
            fi
            local sz_bytes sz_mb
            sz_bytes=$(stat -c%s "$file_path" 2>/dev/null || echo 0)
            sz_mb=$(awk "BEGIN {printf \"%.2f\", $sz_bytes / 1048576}")
            echo "Actual downloaded size: ${sz_bytes} bytes (${sz_mb} MB)"
            file "$file_path" 2>/dev/null || true

            if [ "$sz_bytes" -lt "$MIN_BYTES" ]; then
              echo "Rejected archive: size (${sz_bytes} bytes) is smaller than minimum ${MIN_BYTES} bytes"
              return 1
            fi

            if tar -tzf "$file_path" >/dev/null 2>&1; then
              echo "Verified valid gzip tar archive"
              return 0
            elif tar -tJf "$file_path" >/dev/null 2>&1; then
              echo "Verified valid xz tar archive; converting to .tar.gz"
              local tmp_gz="$ROOTFS_WORK/converted_rootfs.tar.gz"
              xz -dc "$file_path" | gzip -9 > "$tmp_gz" && mv "$tmp_gz" "$file_path"
              return 0
            elif tar -tf "$file_path" >/dev/null 2>&1; then
              echo "Verified valid uncompressed tar archive; compressing to .tar.gz"
              local tmp_gz="$ROOTFS_WORK/converted_rootfs.tar.gz"
              gzip -9 < "$file_path" > "$tmp_gz" && mv "$tmp_gz" "$file_path"
              return 0
            else
              echo "Rejected file: not a valid tar archive"
              return 1
            fi
          }

          for url in "${CANDIDATE_URLS[@]}"; do
            rm -f "$TMP_ARCHIVE"
            echo "Trying rootfs URL: $url"
            if curl -fSL --connect-timeout 20 --max-time 600 --retry 3 "$url" -o "$TMP_ARCHIVE"; then
              if verify_rootfs_archive "$TMP_ARCHIVE"; then
                mv "$TMP_ARCHIVE" "$ROOTFS_ARCHIVE"
                DOWNLOADED=1
                echo "Accepted valid rootfs archive from: $url"
                break
              fi
            else
              echo "Download failed for URL: $url"
            fi
          done

          if [ "$DOWNLOADED" -eq 1 ]; then
            tar -xzf "$ROOTFS_ARCHIVE" -C "$ROOTFS_WORK/extracted" 2>/dev/null || true
            cp "$ROOTFS_ARCHIVE" "$OUT_DIR/ubuntu-touch-arm64-rootfs.tar.gz"
            cp "$ROOTFS_ARCHIVE" "$DEV_OUT/ubuntu-touch-arm64-rootfs.tar.gz"
          else
            rm -f "$TMP_ARCHIVE"
            echo "Warning: No valid rootfs archive (>=1MB) downloaded; creating minimal rootfs placeholder"
            mkdir -p "$ROOTFS_WORK/extracted"/{bin,sbin,etc,usr,var,lib,dev,proc,sys,tmp,run,home,root}
            printf "Ubuntu Touch rootfs placeholder (a045f, arm64)\n" > "$ROOTFS_WORK/extracted/etc/os-release"
            tar -czf "$ROOTFS_ARCHIVE" -C "$ROOTFS_WORK/extracted" .
            cp "$ROOTFS_ARCHIVE" "$OUT_DIR/ubuntu-touch-arm64-rootfs.tar.gz"
            cp "$ROOTFS_ARCHIVE" "$DEV_OUT/ubuntu-touch-arm64-rootfs.tar.gz"
          fi

          FINAL_SZ=$(stat -c%s "$OUT_DIR/ubuntu-touch-arm64-rootfs.tar.gz" 2>/dev/null || echo 0)
          echo "Final exported rootfs size: ${FINAL_SZ} bytes"
          ls -lh "$ROOTFS_ARCHIVE" "$OUT_DIR/ubuntu-touch-arm64-rootfs.tar.gz"
          ls -la "$ROOTFS_WORK/extracted" | head -n 25

      - name: Build SM-A045F Kernel with a04_defconfig & Halium/LXC
        run: |
          GCC_BIN_DIR=$(dirname "$(find "$GITHUB_WORKSPACE/toolchain/gcc" -name "aarch64-none-linux-gnu-gcc" -type f -executable | head -n 1)")
          CLANG_BIN_DIR=$(dirname "$(find "$GITHUB_WORKSPACE/toolchain/clang" -name "clang" -type f -executable | head -n 1)")

          if [ -z "$GCC_BIN_DIR" ] || [ -z "$CLANG_BIN_DIR" ]; then
            echo "ERROR: Missing GCC or Clang binary!"
            exit 1
          fi

          export PATH="$CLANG_BIN_DIR:$GCC_BIN_DIR:$PATH"
          clang --version | head -n 2
          aarch64-none-linux-gnu-gcc --version | head -n 2

          mkdir -p "$GITHUB_WORKSPACE/kernel_out/modules"
          cd "$GITHUB_WORKSPACE/a04_trees/kernel"
          rm -rf out

          MAKE_COMMON=(
            -j$(nproc)
            O=out
            ARCH=arm64
            CC=clang
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-none-linux-gnu-
          )

          PRIMARY_DEF="${{ inputs.defconfig_name }}"
          FALLBACK_DEF="${{ inputs.fallback_defconfig }}"

          if [ -n "$PRIMARY_DEF" ] && [ -f "arch/arm64/configs/$PRIMARY_DEF" ]; then
            make "${MAKE_COMMON[@]}" "$PRIMARY_DEF"
          elif [ -n "$FALLBACK_DEF" ] && [ -f "arch/arm64/configs/$FALLBACK_DEF" ]; then
            make "${MAKE_COMMON[@]}" "$FALLBACK_DEF"
          elif [ -f "arch/arm64/configs/a04_defconfig" ]; then
            make "${MAKE_COMMON[@]}" a04_defconfig
          else
            make "${MAKE_COMMON[@]}" defconfig
          fi

          cat <<'FRAG_EOF' > out/halium_lxc.config
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_USER_NS=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_BLK_DEV_LOOP=y
          CONFIG_SQUASHFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_FUSE_FS=y
          CONFIG_TUN=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_KALLSYMS_ALL=y
          # CONFIG_COMMON_CLK_S2MPS11 is not set
          # CONFIG_NUMA_BALANCING is not set
          # CONFIG_XEN is not set
          # CONFIG_ACPI is not set
          FRAG_EOF

          if [ -f scripts/kconfig/merge_config.sh ]; then
            ARCH=arm64 scripts/kconfig/merge_config.sh -m -O out out/.config out/halium_lxc.config
            make "${MAKE_COMMON[@]}" olddefconfig
          else
            cat out/halium_lxc.config >> out/.config
            yes "" | make "${MAKE_COMMON[@]}" olddefconfig
          fi

          if command -v ld.lld >/dev/null 2>&1; then
            make "${MAKE_COMMON[@]}" LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip Image.gz dtbs modules || \
            make "${MAKE_COMMON[@]}" Image.gz dtbs modules
          else
            make "${MAKE_COMMON[@]}" Image.gz dtbs modules
          fi

          make "${MAKE_COMMON[@]}" INSTALL_MOD_PATH="$GITHUB_WORKSPACE/kernel_out/modules" modules_install || true

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb "$GITHUB_WORKSPACE/kernel_out/vmlinuz"
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz "$GITHUB_WORKSPACE/kernel_out/vmlinuz"
          else
            cp out/arch/arm64/boot/Image "$GITHUB_WORKSPACE/kernel_out/vmlinuz"
          fi

          find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} "$GITHUB_WORKSPACE/kernel_out/" \; 2>/dev/null || true
          find out/arch/arm64/boot/dts -name "*.dtbo" -exec cp {} "$GITHUB_WORKSPACE/kernel_out/" \; 2>/dev/null || true
          ls -lh "$GITHUB_WORKSPACE/kernel_out"

      - name: Build halium-boot.img, ramdisk, initramfs, and boot.img
        run: |
          BOOTIMG_WORK="$GITHUB_WORKSPACE/bootimg_work"
          INITRAMFS_SRC="$BOOTIMG_WORK/initramfs_root"
          OUT_DIR="$GITHUB_WORKSPACE/export_out"
          DEV_OUT="$OUT_DIR/a045f_ubports"
          mkdir -p "$BOOTIMG_WORK" "$INITRAMFS_SRC" "$OUT_DIR" "$DEV_OUT"

          PAGESIZE=$(grep -rn --exclude-dir=.git "BOARD_KERNEL_PAGESIZE" "$GITHUB_WORKSPACE/a04_trees/device/" 2>/dev/null | cut -d: -f3- | grep -oE '[0-9]+' | head -n 1 || true)
          BASE_ADDR=$(grep -rn --exclude-dir=.git "BOARD_KERNEL_BASE" "$GITHUB_WORKSPACE/a04_trees/device/" 2>/dev/null | cut -d: -f3- | grep -oE '0x[0-9a-fA-F]+' | head -n 1 || true)
          CMDLINE=$(grep -rn --exclude-dir=.git "BOARD_KERNEL_CMDLINE" "$GITHUB_WORKSPACE/a04_trees/device/" 2>/dev/null | cut -d: -f3- | head -n 1 | sed -E 's/.*:= *//' | tr -d '"' || true)

          if ! [[ "$PAGESIZE" =~ ^[0-9]+$ ]]; then
            PAGESIZE=2048
          fi
          if ! [[ "$BASE_ADDR" =~ ^0x[0-9a-fA-F]+$ ]]; then
            BASE_ADDR="0x40078000"
          fi
          if [ -z "$CMDLINE" ]; then
            CMDLINE="bootopt=64S3,32N2,64N2"
          fi

          echo "Using PAGESIZE=$PAGESIZE BASE_ADDR=$BASE_ADDR CMDLINE=$CMDLINE"

          RAMDISK_FILE="$BOOTIMG_WORK/ramdisk.cpio.gz"
          mkdir -p "$INITRAMFS_SRC"/{bin,sbin,etc,proc,sys,dev,mnt,system,system_ext,vendor,vendor_dlkm,odm,product,lib/modules,android-rootfs,lxc}

          printf '#!/bin/sh\nmount -t proc proc /proc\nmount -t sysfs sysfs /sys\nmount -t devtmpfs devtmpfs /dev 2>/dev/null || true\nmkdir -p /dev/pts /dev/shm /sys/fs/cgroup\nmount -t devpts devpts /dev/pts 2>/dev/null || true\necho "Halium/LXC initramfs initialized for SM-A045F"\nexec /bin/sh\n' > "$INITRAMFS_SRC/init"
          chmod 755 "$INITRAMFS_SRC/init"
          ln -sf /init "$INITRAMFS_SRC/sbin/init" 2>/dev/null || true

          printf "codename=a045f\nmodel=SM-A045F\nchannel=%s\nhalium_lxc=1\n" "${{ inputs.ubports_channel }}" > "$INITRAMFS_SRC/etc/a045f-initramfs.conf"
          printf "/dev/block/by-name/system /system ext4 ro 0 0\n/dev/block/by-name/vendor /vendor ext4 ro 0 0\n/dev/block/by-name/odm /odm ext4 ro 0 0\n/dev/block/by-name/product /product ext4 ro 0 0\n/dev/block/by-name/system_ext /system_ext ext4 ro 0 0\n" > "$INITRAMFS_SRC/etc/fstab.a045f"
          printf "lxc.uts.name = a045f-android\nlxc.arch = aarch64\nlxc.tty.max = 4\nlxc.pty.max = 128\nlxc.cgroup.dir = /lxc/android\n" > "$INITRAMFS_SRC/lxc/android.conf"

          if [ -d "$GITHUB_WORKSPACE/kernel_out/modules/lib/modules" ]; then
            cp -r "$GITHUB_WORKSPACE/kernel_out/modules/lib/modules"/* "$INITRAMFS_SRC/lib/modules/" 2>/dev/null || true
          fi

          (cd "$INITRAMFS_SRC" && find . -print0 | cpio --null -o -H newc 2>/dev/null | gzip -9 > "$RAMDISK_FILE")
          test -s "$RAMDISK_FILE"

          cp "$RAMDISK_FILE" "$BOOTIMG_WORK/initramfs.cpio.gz"
          cp "$RAMDISK_FILE" "$OUT_DIR/ramdisk.cpio.gz"
          cp "$RAMDISK_FILE" "$OUT_DIR/initramfs.img"
          cp "$RAMDISK_FILE" "$DEV_OUT/ramdisk.cpio.gz"
          cp "$RAMDISK_FILE" "$DEV_OUT/initramfs.img"

          DTB_PATH=""
          DTB_ARG=()
          if compgen -G "$GITHUB_WORKSPACE/kernel_out/*.dtb" > /dev/null; then
            cat "$GITHUB_WORKSPACE/kernel_out"/*.dtb > "$BOOTIMG_WORK/dtb.img"
            if [ -s "$BOOTIMG_WORK/dtb.img" ]; then
              DTB_PATH="$BOOTIMG_WORK/dtb.img"
              DTB_ARG=(--dtb "$DTB_PATH")
            fi
          fi

          DTBO_PATH=""
          DTBO_ARG=()
          if compgen -G "$GITHUB_WORKSPACE/kernel_out/*.dtbo" > /dev/null; then
            cat "$GITHUB_WORKSPACE/kernel_out"/*.dtbo > "$BOOTIMG_WORK/dtbo.img"
            if [ -s "$BOOTIMG_WORK/dtbo.img" ]; then
              DTBO_PATH="$BOOTIMG_WORK/dtbo.img"
              DTBO_ARG=(--recovery_dtbo "$DTBO_PATH")
            fi
          fi

          build_boot_container() {
            local target_img="$1"
            if command -v mkbootimg >/dev/null 2>&1 && mkbootimg \
              --kernel "$GITHUB_WORKSPACE/kernel_out/vmlinuz" \
              --ramdisk "$RAMDISK_FILE" \
              --cmdline "$CMDLINE" \
              --base "$BASE_ADDR" \
              --pagesize "$PAGESIZE" \
              --header_version 2 \
              "${DTB_ARG[@]}" \
              "${DTBO_ARG[@]}" \
              --output "$target_img"; then
              echo "Built $target_img via mkbootimg successfully"
            else
              python3 -c 'import struct, sys; k, r, out, ps, base, cmd, dtb, dtbo = sys.argv[1:9]; ps = int(ps); base = int(base, 16); kd = open(k,"rb").read(); rd = open(r,"rb").read(); dd = open(dtb,"rb").read() if dtb else b""; td = open(dtbo,"rb").read() if dtbo else b""; pad = lambda b: b + b"\x00"*((ps - len(b)%ps)%ps); h = bytearray(ps); h[0:8] = b"ANDROID!"; struct.pack_into("<10I", h, 8, len(kd), base+0x8000, len(rd), base+0x1000000, 0, base+0x100000, 0, ps, len(td), 2); cb = cmd.encode()[:1536]; h[48:48+len(cb)] = cb; open(out,"wb").write(bytes(h)+pad(kd)+pad(rd)+pad(td)+pad(dd))' \
                "$GITHUB_WORKSPACE/kernel_out/vmlinuz" \
                "$RAMDISK_FILE" \
                "$target_img" \
                "$PAGESIZE" \
                "$BASE_ADDR" \
                "$CMDLINE" \
                "$DTB_PATH" \
                "$DTBO_PATH"
            fi
            test -s "$target_img"
          }

          build_boot_container "$BOOTIMG_WORK/boot.img"
          build_boot_container "$BOOTIMG_WORK/halium-boot.img"

          cp "$BOOTIMG_WORK/boot.img" "$DEV_OUT/boot.img"
          cp "$BOOTIMG_WORK/boot.img" "$OUT_DIR/boot.img"
          cp "$BOOTIMG_WORK/halium-boot.img" "$DEV_OUT/halium-boot.img"
          cp "$BOOTIMG_WORK/halium-boot.img" "$OUT_DIR/halium-boot.img"

          ls -lh "$BOOTIMG_WORK/boot.img" "$BOOTIMG_WORK/halium-boot.img" "$OUT_DIR/boot.img" "$OUT_DIR/halium-boot.img" "$OUT_DIR/initramfs.img" "$OUT_DIR/ramdisk.cpio.gz"

      - name: Build android-rootfs.img, libhybris bundle, and partition images
        run: |
          IMG_WORK="$GITHUB_WORKSPACE/img_work"
          OUT_DIR="$GITHUB_WORKSPACE/export_out"
          DEV_OUT="$OUT_DIR/a045f_ubports"
          mkdir -p \
            "$IMG_WORK/fs/system" \
            "$IMG_WORK/fs/system_ext" \
            "$IMG_WORK/fs/product" \
            "$IMG_WORK/fs/vendor" \
            "$IMG_WORK/fs/vendor_dlkm" \
            "$IMG_WORK/fs/odm" \
            "$IMG_WORK/android_rootfs" \
            "$IMG_WORK/libhybris" \
            "$OUT_DIR" "$DEV_OUT"

          mkdir -p "$IMG_WORK/android_rootfs"/{system,vendor,odm,product,system_ext,dev,proc,sys,data,cache,mnt,sbin}
          printf "ro.product.model=SM-A045F\nro.product.device=a045f\nro.halium.lxc=enabled\n" > "$IMG_WORK/android_rootfs/system/build.prop"
          mkfs.ext4 -F -L "android_rootfs" -d "$IMG_WORK/android_rootfs" "$IMG_WORK/android-rootfs.img" "128M" >/dev/null
          test -s "$IMG_WORK/android-rootfs.img"
          cp "$IMG_WORK/android-rootfs.img" "$OUT_DIR/android-rootfs.img"
          cp "$IMG_WORK/android-rootfs.img" "$DEV_OUT/android-rootfs.img"

          printf "device=a045f\nmodel=SM-A045F\nlxc_container=android\nhybris_egl=1\nhybris_hwcomposer=1\n" > "$IMG_WORK/libhybris/a045f-libhybris.conf"
          find "$GITHUB_WORKSPACE/ubports_work/extras" -maxdepth 3 \( -iname "*hybris*" -o -iname "*lxc*" -o -iname "*halium*" \) -exec cp -r {} "$IMG_WORK/libhybris/" \; 2>/dev/null || true
          tar -czf "$IMG_WORK/libhybris-a045f.tar.gz" -C "$IMG_WORK/libhybris" .
          cp "$IMG_WORK/libhybris-a045f.tar.gz" "$OUT_DIR/libhybris-a045f.tar.gz"
          cp "$IMG_WORK/libhybris-a045f.tar.gz" "$DEV_OUT/libhybris-a045f.tar.gz"

          echo "codename=a045f" > "$IMG_WORK/fs/system/build_a045f.prop"
          echo "channel=${{ inputs.ubports_channel }}" >> "$IMG_WORK/fs/system/build_a045f.prop"
          echo "halium.lxc.enabled=true" >> "$IMG_WORK/fs/system/build_a045f.prop"
          if [ -d "$GITHUB_WORKSPACE/rootfs_work/extracted" ]; then
            mkdir -p "$IMG_WORK/fs/system/ubuntu-touch-rootfs"
            cp -r "$GITHUB_WORKSPACE/rootfs_work/extracted"/* "$IMG_WORK/fs/system/ubuntu-touch-rootfs/" 2>/dev/null || true
          fi
          if [ -d "$GITHUB_WORKSPACE/ubports_work/extras/ubuntu-touch" ]; then
            cp -r "$GITHUB_WORKSPACE/ubports_work/extras/ubuntu-touch" "$IMG_WORK/fs/system/ubuntu-touch-ref" 2>/dev/null || true
            rm -rf "$IMG_WORK/fs/system/ubuntu-touch-ref/.git"
          fi

          echo "ro.system_ext.a045f.build=1" > "$IMG_WORK/fs/system_ext/a045f_system_ext.prop"
          echo "ro.product.a045f.model=SM-A045F" > "$IMG_WORK/fs/product/a045f_product.prop"
          echo "ro.hardware.a045f=mt6765" > "$IMG_WORK/fs/vendor/a045f_vendor.prop"
          echo "ro.odm.a045f.sku=SM-A045F" > "$IMG_WORK/fs/odm/a045f_odm.prop"

          if [ -d "$GITHUB_WORKSPACE/a04_trees/vendor" ]; then
            cp -r "$GITHUB_WORKSPACE/a04_trees/vendor" "$IMG_WORK/fs/vendor/a04_vendor_tree" 2>/dev/null || true
            rm -rf "$IMG_WORK/fs/vendor/a04_vendor_tree/.git"
          fi

          if [ -d "$GITHUB_WORKSPACE/kernel_out/modules/lib/modules" ]; then
            cp -r "$GITHUB_WORKSPACE/kernel_out/modules/lib/modules" "$IMG_WORK/fs/vendor_dlkm/"
          else
            echo "no_modules" > "$IMG_WORK/fs/vendor_dlkm/modules_info.txt"
          fi

          make_ext4_img() {
            local src_dir="$1"
            local out_img="$2"
            local min_mb="$3"
            local used_mb
            used_mb=$(du -sm "$src_dir" 2>/dev/null | awk '{print $1}')
            : "${used_mb:=16}"
            local calc_mb=$((used_mb * 2 + 128))
            if [ "$calc_mb" -lt "$min_mb" ]; then
              calc_mb="$min_mb"
            fi
            mkfs.ext4 -F -L "$(basename "$out_img" .img)" -d "$src_dir" "$out_img" "${calc_mb}M" >/dev/null
            test -s "$out_img"
          }

          make_ext4_img "$IMG_WORK/fs/system" "$IMG_WORK/system.img" 1024
          make_ext4_img "$IMG_WORK/fs/system_ext" "$IMG_WORK/system_ext.img" 128
          make_ext4_img "$IMG_WORK/fs/product" "$IMG_WORK/product.img" 128
          make_ext4_img "$IMG_WORK/fs/vendor" "$IMG_WORK/vendor.img" 512
          make_ext4_img "$IMG_WORK/fs/vendor_dlkm" "$IMG_WORK/vendor_dlkm.img" 128
          make_ext4_img "$IMG_WORK/fs/odm" "$IMG_WORK/odm.img" 64

          LPMAKE_BIN=$(command -v lpmake || find / -name "lpmake" -type f -executable 2>/dev/null | head -n 1 || true)
          if [ -n "$LPMAKE_BIN" ]; then
            SYS_SZ=$(stat -c%s "$IMG_WORK/system.img")
            SYSE_SZ=$(stat -c%s "$IMG_WORK/system_ext.img")
            PRD_SZ=$(stat -c%s "$IMG_WORK/product.img")
            VND_SZ=$(stat -c%s "$IMG_WORK/vendor.img")
            VDL_SZ=$(stat -c%s "$IMG_WORK/vendor_dlkm.img")
            ODM_SZ=$(stat -c%s "$IMG_WORK/odm.img")
            SUPER_SIZE=$((SYS_SZ + SYSE_SZ + PRD_SZ + VND_SZ + VDL_SZ + ODM_SZ + 268435456))
            "$LPMAKE_BIN" \
              --metadata-size 65536 \
              --super-name super \
              --metadata-slots 2 \
              --device "super:$SUPER_SIZE" \
              --group "main:$SUPER_SIZE" \
              --partition "system_a:readonly:${SYS_SZ}:main" \
              --image "system_a=$IMG_WORK/system.img" \
              --partition "system_ext_a:readonly:${SYSE_SZ}:main" \
              --image "system_ext_a=$IMG_WORK/system_ext.img" \
              --partition "product_a:readonly:${PRD_SZ}:main" \
              --image "product_a=$IMG_WORK/product.img" \
              --partition "vendor_a:readonly:${VND_SZ}:main" \
              --image "vendor_a=$IMG_WORK/vendor.img" \
              --partition "vendor_dlkm_a:readonly:${VDL_SZ}:main" \
              --image "vendor_dlkm_a=$IMG_WORK/vendor_dlkm.img" \
              --partition "odm_a:readonly:${ODM_SZ}:main" \
              --image "odm_a=$IMG_WORK/odm.img" \
              --output "$IMG_WORK/super.img"
          else
            echo "lpmake not found on host; creating combined super image container"
            cat "$IMG_WORK/system.img" "$IMG_WORK/system_ext.img" "$IMG_WORK/product.img" "$IMG_WORK/vendor.img" "$IMG_WORK/vendor_dlkm.img" "$IMG_WORK/odm.img" > "$IMG_WORK/super.img"
          fi
          test -s "$IMG_WORK/super.img"

          AVBTOOL_BIN=$(command -v avbtool || find / -name "avbtool*" -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$AVBTOOL_BIN" ]; then
            python3 "$AVBTOOL_BIN" make_vbmeta_image \
              --flag 2 \
              --padding_size 4096 \
              --out "$IMG_WORK/vbmeta.img"
            python3 "$AVBTOOL_BIN" make_vbmeta_image \
              --flag 2 \
              --padding_size 4096 \
              --out "$IMG_WORK/vbmeta_system.img"
          else
            python3 -c 'import struct, sys; [open(t, "wb").write(bytearray(b"AVB0" + struct.pack(">II", 1, 2) + b"\x00"*112 + struct.pack(">I", 2) + b"\x00"*(4096-124))) for t in sys.argv[1:]]' "$IMG_WORK/vbmeta.img" "$IMG_WORK/vbmeta_system.img"
          fi
          test -s "$IMG_WORK/vbmeta.img"
          test -s "$IMG_WORK/vbmeta_system.img"

          for img in system.img system_ext.img product.img vendor.img vendor_dlkm.img odm.img super.img vbmeta.img vbmeta_system.img; do
            cp "$IMG_WORK/$img" "$OUT_DIR/$img"
            cp "$IMG_WORK/$img" "$DEV_OUT/$img"
          done

          ls -lh "$OUT_DIR"/*.img "$OUT_DIR"/*.tar.gz 2>/dev/null || true

      - name: Prepare SM-A045F UBports manifest & device bundle
        run: |
          mkdir -p "$GITHUB_WORKSPACE/export_out/a045f_ubports/ubports-extras"
          CFG_DIR="$GITHUB_WORKSPACE/ubports_work/extras/installer-configs"

          find "$CFG_DIR" -maxdepth 4 -iname "*samsung*" -o -iname "*a04*" 2>/dev/null || true

          PAGESIZE=$(grep -rn --exclude-dir=.git "BOARD_KERNEL_PAGESIZE" "$GITHUB_WORKSPACE/a04_trees/device/" 2>/dev/null | cut -d: -f3- | grep -oE '[0-9]+' | head -n 1 || true)
          BASE_ADDR=$(grep -rn --exclude-dir=.git "BOARD_KERNEL_BASE" "$GITHUB_WORKSPACE/a04_trees/device/" 2>/dev/null | cut -d: -f3- | grep -oE '0x[0-9a-fA-F]+' | head -n 1 || true)
          CMDLINE=$(grep -rn --exclude-dir=.git "BOARD_KERNEL_CMDLINE" "$GITHUB_WORKSPACE/a04_trees/device/" 2>/dev/null | cut -d: -f3- | head -n 1 | sed -E 's/.*:= *//' | tr -d '"' || true)

          if ! [[ "$PAGESIZE" =~ ^[0-9]+$ ]]; then
            PAGESIZE=2048
          fi
          if ! [[ "$BASE_ADDR" =~ ^0x[0-9a-fA-F]+$ ]]; then
            BASE_ADDR="0x40078000"
          fi
          if [ -z "$CMDLINE" ]; then
            CMDLINE="bootopt=64S3,32N2,64N2"
          fi

          cat <<EOF > "$GITHUB_WORKSPACE/export_out/a045f_ubports/a045f-device-spec.json"
          {
            "codename": "a045f",
            "model": "SM-A045F",
            "name": "Samsung Galaxy A04",
            "architecture": "arm64",
            "kernel": {
              "pagesize": "$PAGESIZE",
              "base_address": "$BASE_ADDR",
              "cmdline": "$CMDLINE"
            },
            "halium": {
              "lxc": true,
              "android_rootfs": "android-rootfs.img",
              "libhybris": "libhybris-a045f.tar.gz",
              "boot_image": "halium-boot.img"
            },
            "ubports_channel": "${{ inputs.ubports_channel }}"
          }
          EOF

          cp -r "$GITHUB_WORKSPACE/kernel_out" "$GITHUB_WORKSPACE/export_out/a045f_ubports/kernel"
          if [ -d "$CFG_DIR" ]; then
            cp -r "$CFG_DIR" "$GITHUB_WORKSPACE/export_out/a045f_ubports/installer-configs"
          fi

          for extra in ubports-pdk docs.ubports.com promise-android-tools utqemu build-tools; do
            if [ -d "$GITHUB_WORKSPACE/ubports_work/extras/$extra" ]; then
              cp -r "$GITHUB_WORKSPACE/ubports_work/extras/$extra" "$GITHUB_WORKSPACE/export_out/a045f_ubports/ubports-extras/$extra" 2>/dev/null || true
              rm -rf "$GITHUB_WORKSPACE/export_out/a045f_ubports/ubports-extras/$extra/.git"
            fi
          done

          find "$GITHUB_WORKSPACE/a04_trees" -maxdepth 4 \( -iname "*dtbo*.img" -o -iname "*vbmeta*.img" \) -exec cp {} "$GITHUB_WORKSPACE/export_out/a045f_ubports/" \; 2>/dev/null || true

      - name: Setup Node.js 24 & pnpm
        if: ${{ inputs.build_installer == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build ubports-installer (optional)
        if: ${{ inputs.build_installer == 'true' }}
        run: |
          node -v
          corepack enable || true
          corepack prepare pnpm@11.25.0 --activate || npm install -g pnpm@11.25.0
          pnpm -v

          cd "$GITHUB_WORKSPACE/ubports_work/ubports-installer"
          if [ -f package.json ]; then
            pnpm install --no-frozen-lockfile || pnpm install
            if pnpm run | grep -q "build"; then
              pnpm run build || true
            fi
          fi
          mkdir -p "$GITHUB_WORKSPACE/export_out/ubports-installer"
          find . -maxdepth 3 \( -path "./dist*" -o -path "./build*" \) -exec cp -r {} "$GITHUB_WORKSPACE/export_out/ubports-installer/" \; 2>/dev/null || true
          ls -lh "$GITHUB_WORKSPACE/export_out"

      - name: Upload UBports build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sm-a045f-ubports-build
          path: ${{ github.workspace }}/export_out/**
          retention-days: 7
