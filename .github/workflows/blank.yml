name: Build LineageOS for Galaxy A04

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          docker image prune -a --force

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zip zlib1g-dev

      - name: Initialize LineageOS Workspace
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "Your Name"
          git config --global user.email "your-email@example.com"
          repo init -u https://github.com/LineageOS/android.git -b lineage-23.2 --git-lfs --depth=1

      - name: Setup Local Manifests
        run: |
          cd workspace
          mkdir -p .repo/local_manifests
          cat << 'EOF' > .repo/local_manifests/a04.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="A04-Trees-and-ROMs/android_device_samsung_a04" path="device/samsung/a04" remote="github" revision="lineage-22.2" />
            <project name="A04-Trees-and-ROMs/android_vendor_samsung_a04" path="vendor/samsung/a04" remote="github" revision="lineage-22.2" />
            <project name="A04-Trees-and-ROMs/android_kernel_samsung_a04" path="kernel/samsung/a04" remote="github" revision="lineage-22.2" />
          </manifest>
          EOF

      - name: Sync Source Tree
        run: |
          cd workspace
          # إضافة --depth=1 و --no-tags يوفر مساحة تخزينية ضخمة جداً
          repo sync -c --no-clone-bundle --depth=1 --no-tags --force-sync -j$(nproc)

      - name: Start Compilation
        run: |
          cd workspace
          export USE_CCACHE=1
          export CCACHE_DIR=/home/runner/work/ccache
          prebuilts/misc/linux-x86/ccache/ccache -M 50G
          source build/envsetup.sh
          breakfast lineage_a04-userdebug
          mka bacon

      - name: Cleanup and Upload
        run: |
          # العثور على ملف الـ zip ونقله لمكان آمن
          mkdir -p artifacts
          find workspace/out/target/product/a04/ -name "lineage-*.zip" -exec cp {} artifacts/ \;
          
          # حذف مجلد الـ out لتوفير المساحة بعد البناء
          rm -rf workspace/out
          
      - name: Upload Zip
        uses: actions/upload-artifact@v4
        with:
          name: ROM-A04
          path: artifacts/*.zip
