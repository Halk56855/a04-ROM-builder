name: Build Samsung Super Image

on:
  workflow_dispatch:
    inputs:
      stock_rom_url:
        description: 'رابط الروم المعدل/الأصلي (OneUI Clean)'
        required: true
        default: 'https://downloads.sourceforge.net/project/oneui-unleashed/A04/No-GApps%20with%20Samsung%20Bloatware%20Debloated/Odin%20Flashable/V1.1/A04%20Clean%20Debloat.zip'
        type: string
      gsi_url:
        description: 'رابط ملف الـ GSI الجديد (OneUI 7 / SM-A057F)'
        required: true
        default: 'https://downloads.sourceforge.net/project/axisgsiupdates/oneui/OneUI7-15-a05s-A057FXXSADYH1-15062026-AxisGSI.zip?ts=gAAAAABqw7hLqDoJFMEYiPorerO2l7xKgYBBaAw7R6KIF4ratCBb3rHhGynVZADvzezc8y-ng9FGlbBy_e8YD32pc5GgqVugCQ%3D%3D&use_mirror=excellmedia&r=android-app%3A%2F%2Forg.telegram.plus%2F'
        type: string
      super_size:
        description: 'حجم قسم super بالبايت (3.91 GiB = 4198481920)'
        required: true
        default: '4198481920'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget p7zip-full tar unzip file curl \
          build-essential cmake ninja-build libprotobuf-dev protobuf-compiler \
          libfmt-dev libbrotli-dev libzstd-dev liblz4-dev libgtest-dev \
          libusb-1.0-0-dev libpcre2-dev pkg-config e2fsprogs erofs-utils \
          android-sdk-libsparse-utils android-sdk-platform-tools-common

    - name: Download & Build lpmake From Source Archive
      run: |
        echo "Downloading clean android-tools source archive..."
        curl -sL "https://github.com/nmeum/android-tools/releases/download/35.0.2/android-tools-35.0.2.tar.xz" -o android-tools.tar.xz
        mkdir android-tools-src
        tar -xf android-tools.tar.xz -C android-tools-src --strip-components=1
        
        cd android-tools-src
        mkdir build && cd build
        
        cmake .. -GNinja \
          -DBUILD_SHARED_LIBS=OFF \
          -DANDROID_TOOLS_BUILD_BUILD=OFF \
          -DANDROID_TOOLS_BUILD_FASTBOOT=OFF \
          -DANDROID_TOOLS_BUILD_ADB=OFF
          
        ninja lpmake
        
        cp vendor/lpmake ../../lpmake || find . -name "lpmake" -type f -exec cp {} ../../lpmake \;
        cd ../..
        chmod +x lpmake
        echo "lpmake successfully compiled natively."

    - name: Download Stock ROM and GSI
      run: |
        echo "Downloading Stock ROM..."
        wget -q --show-progress -O stock_file.zip "${{ github.event.inputs.stock_rom_url }}"
        
        echo "Downloading AxisGSI OneUI 7..."
        wget -q --show-progress -O gsi_file.zip "${{ github.event.inputs.gsi_url }}"

    - name: Unpack and Extract Images
      run: |
        mkdir -p extracted_stock extracted_gsi
        
        unzip -q stock_file.zip -d extracted_stock/
        unzip -q gsi_file.zip -d extracted_gsi/ || 7z x gsi_file.zip -oextracted_gsi/
        
        GSI_IMG=$(find extracted_gsi/ -type f -name "*.img" | head -n 1)
        if [ -n "$GSI_IMG" ]; then
          mv "$GSI_IMG" system_input.img
        else
          echo "Error: system.img not found in GSI ZIP!" && exit 1
        fi
        
        VENDOR_IMG=$(find extracted_stock/ -type f -name "vendor.img" | head -n 1)
        if [ -n "$VENDOR_IMG" ]; then
          mv "$VENDOR_IMG" vendor_input.img
        fi

    - name: Mount, Light Debloat & Re-pack Tight ext4
      run: |
        echo "Converting system image to RAW format..."
        simg2img system_input.img system_raw.img 2>/dev/null || mv system_input.img system_raw.img
        rm -f system_input.img

        mkdir -p /tmp/sys_mount /tmp/sys_dump
        
        echo "Mounting raw image..."
        sudo mount -o loop,ro system_raw.img /tmp/sys_mount || {
          echo "Trying erofs mount..."
          sudo mount -t erofs -o loop system_raw.img /tmp/sys_mount
        }

        echo "Copying contents to dump directory..."
        sudo cp -a /tmp/sys_mount/* /tmp/sys_dump/
        sudo umount /tmp/sys_mount
        rm -f system_raw.img

        echo "--- STARTING LIGHT DEBLOAT ---"
        # إزالة التطبيقات الثقيلة لتقليص الـ 480MB الفائضة
        sudo rm -rf /tmp/sys_dump/system/app/YouTube /tmp/sys_dump/app/YouTube 2>/dev/null || true
        sudo rm -rf /tmp/sys_dump/system/app/Chrome /tmp/sys_dump/app/Chrome 2>/dev/null || true
        sudo rm -rf /tmp/sys_dump/system/priv-app/Velvet /tmp/sys_dump/priv-app/Velvet 2>/dev/null || true
        sudo rm -rf /tmp/sys_dump/system/product/app/YouTube /tmp/sys_dump/product/app/Chrome 2>/dev/null || true
        echo "--- LIGHT DEBLOAT COMPLETED ---"

        echo "Calculating new directory size..."
        DIR_SIZE_KB=$(sudo du -sk /tmp/sys_dump | awk '{print $1}')
        TARGET_SIZE_KB=$(( DIR_SIZE_KB + (DIR_SIZE_KB * 3 / 100) ))
        TARGET_SIZE_BYTES=$(( TARGET_SIZE_KB * 1024 ))
        
        echo "New raw ext4 size: $TARGET_SIZE_BYTES bytes ($(( TARGET_SIZE_KB / 1024 )) MB)"

        echo "Creating new tight ext4 image..."
        truncate -s ${TARGET_SIZE_BYTES} system_new_raw.img
        sudo mkfs.ext4 -F -O ^huge_file -m 0 system_new_raw.img
        
        mkdir -p /tmp/new_mount
        sudo mount -o loop system_new_raw.img /tmp/new_mount
        sudo cp -a /tmp/sys_dump/* /tmp/new_mount/
        sudo umount /tmp/new_mount
        sudo rm -rf /tmp/sys_dump /tmp/sys_mount /tmp/new_mount

        echo "Converting system_new_raw.img to sparse system.img..."
        img2simg system_new_raw.img system.img
        rm -f system_new_raw.img

        if [ -f vendor_input.img ]; then
          echo "Processing vendor image..."
          simg2img vendor_input.img vendor_raw.img 2>/dev/null || mv vendor_input.img vendor_raw.img
          rm -f vendor_input.img
          e2fsck -y -f vendor_raw.img || true
          resize2fs -M vendor_raw.img || true
          img2simg vendor_raw.img vendor.img
          rm -f vendor_raw.img
        fi

    - name: Build Combined super.img
      run: |
        SYS_SIZE=$(stat -c%s system.img)
        SUPER_SIZE=${{ github.event.inputs.super_size }}
        
        echo "Calculated system.img sparse size: $SYS_SIZE bytes"
        
        ARG_COMMAND="./lpmake --metadata-size 65536 --super-name super --metadata-slots 2 --device super:$SUPER_SIZE --group main:$SUPER_SIZE"
        ARG_COMMAND="$ARG_COMMAND --partition system:readonly:$SYS_SIZE:main --image system=system.img"
        
        if [ -f vendor.img ]; then
          VEN_SIZE=$(stat -c%s vendor.img)
          echo "Calculated vendor.img sparse size: $VEN_SIZE bytes"
          ARG_COMMAND="$ARG_COMMAND --partition vendor:readonly:$VEN_SIZE:main --image vendor=vendor.img"
        fi
        
        ARG_COMMAND="$ARG_COMMAND --output super.img"
        
        echo "Executing: $ARG_COMMAND"
        eval $ARG_COMMAND

    - name: Create Odin Flashable TAR Archive
      run: |
        echo "Compressing super.img into super.tar for Odin..."
        tar -cvf super.tar super.img

    - name: Upload Odin Ready Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Samsung-Odin-Super-TAR
        path: super.tar
