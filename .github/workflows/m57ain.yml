name: HyperOS Porting for Galaxy A04 using Android_Image_Tools

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment & Dependencies
        run: |
          sudo apt-get update
          # تثبيت الحزم المطلوبة خصيصاً لأداة Android_Image_Tools
          sudo apt-get install -y aria2 cpio python3 python3-pip openjdk-11-jdk wget curl git zip unzip bc bison flex build-essential libssl-dev libstdc++6 lz4 android-sdk-libsparse-utils pv libfuse3-dev f2fs-tools fuse2fs attr erofs-utils

      - name: Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Download Base ROM & Port ROM with Optimized Settings
        run: |
          mkdir -p workspace/INPUT_IMAGES workspace/REPACKED_IMAGES
          
          echo "Downloading Base ROM (Samsung Galaxy A04)..."
          aria2c -c -x16 -s16 --max-connection-per-server=16 "https://drive.usercontent.google.com/download?id=1dtgh65lqqns4N_zHPOi2ZPaUnWWLZzuV&export=download&authuser=0" -d workspace/INPUT_IMAGES -o base.zip
          
          echo "Downloading Port ROM (Redmi A2 HyperOS)..."
          aria2c -c -x16 -s16 --max-connection-per-server=16 "https://bigota.d.miui.com/V14.0.44.0.TGOMIXM/water_global_images_V14.0.44.0.TGOMIXM_20251223.0000.00_13.0_a137b8cfcd.tgz" -d workspace/INPUT_IMAGES -o port.tgz

      - name: Clone Android Image Tools Kitchen
        run: |
          git clone https://github.com/ravindu644/Android_Image_Tools.git workspace/kitchen

      - name: Run Processing & Unpacking with Root Privileges
        run: |
          cd workspace/kitchen
          chmod +x android_image_tools.sh
          # تمرير متغير البيئة لتجنب خطأ الـ terminal
          export TERM=xterm
          sudo -E ./android_image_tools.sh || true

      - name: Copy Results to Repacked Folder
        run: |
          mkdir -p workspace/REPACKED_IMAGES
          cp -rf workspace/kitchen/REPACKED_IMAGES/* workspace/REPACKED_IMAGES/ || echo "No files to copy yet"

      - name: Pack Final ROM to Flashable ZIP
        run: |
          cd workspace/REPACKED_IMAGES
          if [ -n "$(ls -A .)" ]; then
            zip -r9 Galaxy-A04-HyperOS-Port.zip *
          else
            echo "Error: Output folder is empty!"
            exit 1
          fi

      - name: Upload Built ROM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-A04-HyperOS-Port
          path: workspace/REPACKED_IMAGES/*.zip
