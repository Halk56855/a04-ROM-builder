name: Build Nura Linux for SM-A045F

on:
  workflow_dispatch:
    inputs:
      defconfig_name:
        description: "Defconfig file in arch/arm64/configs"
        required: true
        default: "a04_00_defconfig"
      ui_choice:
        description: "UI (console, phosh, plasma-mobile)"
        required: true
        default: "console"

jobs:
  build-a045f:
    runs-on: ubuntu-24.04
    steps:
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3 openssl kpartx udev bc bison flex libssl-dev \
            build-essential device-tree-compiler android-sdk-libsparse-utils

      - name: Clone Nura repos and A04 trees
        run: |
          mkdir -p "$HOME/nura_work" "$HOME/a04_trees"
          git clone --depth=1 https://gitlab.nura.eco/nura/pmbootstrap.git "$HOME/nura_work/pmbootstrap"
          git clone --depth=1 https://gitlab.nura.eco/nura/pmaports.git "$HOME/nura_work/pmaports"
          git clone --depth=1 https://github.com/A04-Trees-and-ROMs/android_device_samsung_a04.git "$HOME/a04_trees/device"
          git clone --depth=1 https://github.com/A04-Trees-and-ROMs/android_vendor_samsung_a04.git "$HOME/a04_trees/vendor"
          git clone --depth=1 https://github.com/A04-Trees-and-ROMs/android_kernel_samsung_a04.git "$HOME/a04_trees/kernel"
          echo "$HOME/nura_work/pmbootstrap" >> "$GITHUB_PATH"

      - name: Create device-samsung-a045f and linux-samsung-a045f in pmaports
        run: |
          DEV_DIR="$HOME/nura_work/pmaports/device/testing/device-samsung-a045f"
          KRN_DIR="$HOME/nura_work/pmaports/device/testing/linux-samsung-a045f"
          mkdir -p "$DEV_DIR" "$KRN_DIR"

          cat <<'EOF' > "$DEV_DIR/deviceinfo"
          deviceinfo_format_version="0"
          deviceinfo_name="Samsung Galaxy A04 (SM-A045F)"
          deviceinfo_codename="a045f"
          deviceinfo_manufacturer="Samsung"
          deviceinfo_arch="aarch64"
          deviceinfo_chassis="handset"
          deviceinfo_flash_methods="heimdall"
          deviceinfo_bootimg_qcdt="false"
          deviceinfo_bootimg_dtb_second="false"
          deviceinfo_generate_bootimg="true"
          deviceinfo_header_version="2"
          deviceinfo_kernel_cmdline=""
          EOF

          cat <<'EOF' > "$DEV_DIR/APKBUILD"
          pkgname=device-samsung-a045f
          pkgver=1
          pkgrel=0
          pkgdesc="Samsung Galaxy A04 SM-A045F deviceinfo"
          arch="aarch64"
          license="MIT"
          depends="linux-samsung-a045f postmarketos-base"
          makedepends="devicepkg-dev"
          source="deviceinfo"

          build() {
              devicepkg_build $startdir $pkgname
          }

          package() {
              devicepkg_package $startdir $pkgname
          }

          sha512sums="
          SKIP  deviceinfo
          "
          EOF

          cat <<EOF > "$KRN_DIR/APKBUILD"
          pkgname=linux-samsung-a045f
          pkgver=4.19.0
          pkgrel=0
          pkgdesc="Samsung Galaxy A04 SM-A045F kernel"
          arch="aarch64"
          license="GPL-2.0-only"
          depends="postmarketos-mkinitfs"
          makedepends="bash bc bison device-tree-compiler flex openssl-dev perl"
          options="!strip !check !tracedeps pmb:cross-native"
          source=""

          prepare() {
              rm -rf "\$srcdir/kernel"
              cp -r "$HOME/a04_trees/kernel" "\$srcdir/kernel"
              cd "\$srcdir/kernel"
              make ARCH=arm64 "${{ inputs.defconfig_name }}"
          }

          build() {
              cd "\$srcdir/kernel"
              make ARCH=arm64 -j\$(nproc) Image.gz dtbs modules
          }

          package() {
              cd "\$srcdir/kernel"
              mkdir -p "\$pkgdir/boot" "\$pkgdir/lib/modules"
              cp arch/arm64/boot/Image.gz "\$pkgdir/boot/vmlinuz"
              find arch/arm64/boot/dts -name "*.dtb" -exec cp {} "\$pkgdir/boot/" \; 2>/dev/null || true
              make ARCH=arm64 INSTALL_MOD_PATH="\$pkgdir" modules_install
          }
          EOF

          pmbootstrap checksum device-samsung-a045f || true
          pmbootstrap checksum linux-samsung-a045f || true

      - name: Configure pmbootstrap
        run: |
          mkdir -p "$HOME/.config" "$HOME/pm_work"
          cat <<EOF > "$HOME/.config/pmbootstrap.cfg"
          [pmbootstrap]
          aports = $HOME/nura_work/pmaports
          work = $HOME/pm_work
          device = samsung-a045f
          ui = ${{ inputs.ui_choice }}
          kernel = samsung-a045f
          extra_packages = none
          timezone = Asia/Bahrain
          hostname = a045f
          user = user
          non_interactive = True
          EOF
          pmbootstrap --version

      - name: Build kernel, rootfs, and export images
        run: |
          mkdir -p "$HOME/export_out"
          pmbootstrap --arch=aarch64 build linux-samsung-a045f
          pmbootstrap install
          pmbootstrap export --odin "$HOME/export_out" || pmbootstrap export "$HOME/export_out"
          ls -lh "$HOME/export_out"

      - name: Upload built images as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm-a045f-nura-linux-images
          path: /home/runner/export_out/*
          retention-days: 7
